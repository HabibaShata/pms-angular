<section
  class="auth-container flex-column d-flex align-items-center justify-content-center"
>
  <header class="mb-4">
    <img src="../../assets/images/Logo-PMS3.svg" alt="Logo" class="w-100" />
  </header>

  <div class="auth-card d-flex flex-column align-items-center">
    <div class="w-100">
      <!----Auth Header------->
      <div class="w-100">
        <app-auth-header
          [title]="'Forget Password'"
          [description]="'welcome to PMS'"
        />
      </div>
      <!------------>

      <div class="forgot-form-container">
        <form
          class="w-100 row"
          [formGroup]="forgotPassForm"
          (ngSubmit)="onForgotPass()"
        >
          <!-- Email -->
          <div class="col-12 my-4">
            <label class="custom-label mb-2"> E-mail </label>
            <mat-form-field appearance="outline" class="w-100">
              <input
                matInput
                type="email"
                placeholder="Enter your E-mail"
                formControlName="email"
                required
              />
              <mat-error
                *ngIf="
                  forgotPassForm.get('email')?.invalid &&
                  (forgotPassForm.get('email')?.touched ||
                    forgotPassForm.get('email')?.dirty)
                "
              >
                {{
                  forgotPassForm.get("email")?.errors?.["required"]
                    ? "Email is required"
                    : "Please enter a valid email address"
                }}
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Error Message -->
          <div class="col-12" *ngIf="errorMessage">
            <div class="alert alert-danger mb-2 py-1">
              {{ errorMessage }}
            </div>
          </div>

          <!-- Button -->
          <div class="col-11 my-4 m-auto">
            <button
              class="auth-btn w-100 d-flex flex-row-reverse gap-2 align-items-center justify-content-center"
              type="submit"
              [disabled]="isLoading || forgotPassForm.invalid"
            >
              <span>Verify</span>
              <mat-spinner *ngIf="isLoading" diameter="22"></mat-spinner>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>

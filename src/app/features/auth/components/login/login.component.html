<!----Auth Header------->
<div class="w-100">
  <app-auth-header [title]="'Login'" [description]="'Enter your email and password to login'" />
</div>
<!------------>
<!------->
<div class="container">
  <form class="w-100 row g-3" [formGroup]="loginForm" (ngSubmit)="onLogin()">
    <!-- Email -->
    <div class="col-12">
      <label class="custom-label mb-2">
        Email Address
      </label>

      <mat-form-field appearance="outline" class="w-100">

        <mat-icon matPrefix class="me-2">
          email
        </mat-icon>

        <input matInput type="email" placeholder="Enter your email" formControlName="email" required>

        <mat-error *ngIf="loginForm.get('email')?.invalid &&
      (loginForm.get('email')?.touched || loginForm.get('email')?.dirty)">

          Please enter a valid email address

        </mat-error>

      </mat-form-field>

    </div>

    <!-- Password -->
    <div class="col-12">

      <label class="custom-label mb-2">
        Password
      </label>

      <mat-form-field appearance="outline" class="w-100">
        <mat-icon matPrefix class="me-2">
          lock
        </mat-icon>
        <input matInput [type]="hide ? 'password' : 'text'" placeholder="Enter your password" formControlName="password"
          required>
        <button mat-icon-button matSuffix type="button" (click)="hide = !hide">
          <mat-icon>
            {{ hide ? 'visibility_off' : 'visibility' }}
          </mat-icon>

        </button>

        <mat-error *ngIf="loginForm.get('password')?.invalid &&
      (loginForm.get('password')?.touched || loginForm.get('password')?.dirty)">

          Password must contain uppercase, lowercase, special character and minimum 6 characters

        </mat-error>

      </mat-form-field>

    </div>

    <!-- Links -->
    <div class="col-12 d-flex justify-content-between align-items-center flex-wrap">

      <a routerLink="/auth/register" class="auth-link">
        Create Account
      </a>

      <a routerLink="/auth/forgot-password" class="auth-link primary-link">
        Forgot Password?
      </a>

    </div>

    <!-- Error Message -->
    <div class="col-12" *ngIf="errorMessage">

      <div class="alert alert-danger mb-0">
        {{ errorMessage }}
      </div>

    </div>

    <!-- Button -->
    <div class="col-12">

      <button mat-raised-button color="primary" class="login-btn w-100" type="submit">

        <span *ngIf="!isLoading">Login</span>

        <mat-spinner *ngIf="isLoading" diameter="22">
        </mat-spinner>

      </button>

    </div>

  </form>
</div>

<section class="project-list-wrapper">
  <!-- start of header -->
  <div class="container-fluid project-list-header">
    <div class="row d-flex align-items-center justify-content-between mx-auto">
      <h3 class="col-md-9 m-0 p-0">Projects</h3>
      <!-- Button -->
      <div class="col-md-3 d-flex justify-content-end">
        <button
          class="main-btn d-flex flex-row-reverse gap-2 align-items-center justify-content-center"
          type="submit"
          [routerLink]="['add']"
        >
          <span class="d-flex align-items-center gap-1">
            <mat-icon
              aria-hidden="false"
              aria-label="Example home icon"
              fontIcon="add"
            ></mat-icon>

            Add New Project</span
          >
        </button>
      </div>
    </div>
  </div>
  <!-- end of header -->

  <!-- start of table -->
  <div class="container-fluid project-list-table-container mx-auto">
    <div class="project-list-table">
      <div class="project-list-table-header w-50">
        <mat-form-field appearance="outline">
          <mat-label class="d-flex align-items-center gap-1">
            <mat-icon
              aria-hidden="false"
              aria-label="Example home icon"
              fontIcon="search"
            ></mat-icon
            >Search By Title</mat-label
          >
          <input matInput (keyup)="applyFilter($event)" #input />
        </mat-form-field>
      </div>

      <div class="mat-elevation-z8">
        <ng-container *ngIf="dataSource.data.length > 0; else loader">
          <table mat-table [dataSource]="dataSource" matSort>
            <!-- title Column -->
            <ng-container matColumnDef="title">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
              <td mat-cell *matCellDef="let row">{{ row.title }}</td>
            </ng-container>

            <!-- Statues Column -->
            <ng-container matColumnDef="Statues">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
              <td mat-cell *matCellDef="let row">
                <span class="status">Public</span>
              </td>
            </ng-container>

            <!-- Num Tasks -->
            <ng-container matColumnDef="Num Tasks">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Num Tasks
              </th>
              <td mat-cell *matCellDef="let row">
                {{ row.task?.length ? row.task?.length : "Unassigned" }}
              </td>
            </ng-container>
            <!-- Date Created Column -->
            <ng-container matColumnDef="Date Created">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>
                Date Created
              </th>
              <td mat-cell *matCellDef="let row">
                {{ row.creationDate | date: "short" }}
              </td>
            </ng-container>
            <!-- Actions Column -->
            <ng-container matColumnDef="Actions">
              <th mat-header-cell *matHeaderCellDef mat-sort-header>Actions</th>
              <td mat-cell *matCellDef="let row">
                <button
                  mat-icon-button
                  [matMenuTriggerFor]="menu"
                  aria-label="Example icon-button with a menu"
                >
                  <mat-icon>more_vert</mat-icon>
                </button>
                <mat-menu #menu="matMenu">
                  <button mat-menu-item (click)="openViewDialog(row)">
                    <mat-icon>visibility</mat-icon>
                    <span>View</span>
                  </button>
                  <button mat-menu-item [routerLink]="['edit', row.id]">
                    <mat-icon>edit_square</mat-icon>
                    <span>Edit</span>
                  </button>
                  <button mat-menu-item (click)="openDeleteDialog(row)">
                    <mat-icon fontIcon="delete"></mat-icon>
                    <span>Delete</span>
                  </button>
                </mat-menu>
              </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr
              mat-row
              *matRowDef="let row; columns: displayedColumns; let i = index"
              [class]="i % 2 !== 0 ? 'odd-row' : ''"
            ></tr>

            <!-- Row shown when there is no matching data. -->
            <tr class="mat-row" *matNoDataRow>
              <td class="mat-cell" colspan="5">
                <app-empty-status [elementName]="input.value" />
              </td>
            </tr>
          </table>

          <mat-paginator
            [length]="length"
            [pageSize]="pageSize"
            [pageIndex]="pageNumber - 1"
            [pageSizeOptions]="[10, 25, 100]"
            (page)="onPageChange($event)"
            aria-label="Select page of users"
          ></mat-paginator>
        </ng-container>
      </div>
    </div>
  </div>
  <!-- Loader (Shown when users && Tasks data is not yet loaded) -->
  <ng-template #loader>
    <app-loader></app-loader>
  </ng-template>
</section>

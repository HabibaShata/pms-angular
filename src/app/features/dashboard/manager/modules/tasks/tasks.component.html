<section class="project-list-wrapper">
  <!-- start of header -->
  <div class="container-fluid project-list-header">
    <div class="row d-flex align-items-center justify-content-between mx-auto">
      <h3 class="col-md-9 m-0 p-0 table-header-title">Tasks</h3>
      <!-- Button -->
      <div class="col-md-3 d-flex justify-content-end">
        <button class="main-btn d-flex flex-row-reverse gap-2 align-items-center justify-content-center" type="submit"
          routerLink="add">
          <span class="d-flex align-items-center gap-1">
            <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="add"></mat-icon>

            Add New Task</span>
        </button>
      </div>
    </div>
  </div>
  <!-- end of header -->

  <!-- start of table -->
  <div class="container-fluid project-list-table-container mx-auto">
    <div class="project-list-table">
      <div class="project-list-table-header d-flex align-items-center mb-3">
        <mat-form-field appearance="fill" class="custom-input">
          <mat-label class="d-flex align-items-center gap-1">
            <mat-icon
              aria-hidden="false"
              aria-label="Example home icon"
              fontIcon="search"
            ></mat-icon
            >Search By Title</mat-label
          >
          <input matInput (keyup)="applyFilter($event)" #input />
        </mat-form-field>

        <mat-form-field appearance="fill" class="custom-select">
          <mat-label>
            <mat-icon>filter_list</mat-icon>
            filters
          </mat-label>
          <mat-select
            [formControl]="toppings"
            (selectionChange)="applySelectFilter($event)"
          >
            <mat-option>None</mat-option>
            <mat-option *ngFor="let topping of toppingList" [value]="topping">{{
              topping
            }}</mat-option>
          </mat-select>
        </mat-form-field>
        <!-- <mat-form-field>
          <mat-label>
            <mat-icon>filter_list</mat-icon>
            filters
          </mat-label>
          <mat-select [formControl]="toppings" multiple>
            <mat-select-trigger>
              {{ toppings.value?.[0] || "" }}
              <span *ngIf="(toppings.value?.length || 0) > 1" class="example-additional-selection">
                (+{{ (toppings.value?.length || 0) - 1 }}
                {{ toppings.value?.length === 2 ? "other" : "others" }})
              </span>
            </mat-select-trigger>
            <mat-option *ngFor="let topping of toppingList" [value]="topping">{{
              topping
              }}</mat-option>
          </mat-select>
        </mat-form-field> -->
      </div>

      <div class="mat-elevation-z8">
        <!-- LOADING -->
        <ng-container *ngIf="isLoading; else content">
          <app-loader></app-loader>
        </ng-container>

        <!-- CONTENT -->
        <ng-template #content>
          <ng-container *ngIf="dataSource.data && dataSource.data.length > 0; else emptyState">
            <table mat-table [dataSource]="dataSource" matSort>
              <!-- Title Column -->
              <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
                <td mat-cell *matCellDef="let row">{{ row.title }}</td>
              </ng-container>

              <!-- Status Column -->
              <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let row">
                  <ng-container [ngSwitch]="row.status">
                    <span *ngSwitchCase="status.ToDo" class="status to-do">{{
                      row.status
                      }}</span>
                    <span *ngSwitchCase="status.InProgress" class="status in-progress">{{ row.status }}</span>
                    <span *ngSwitchCase="status.Done" class="status done">{{
                      row.status
                      }}</span>
                    <span *ngSwitchDefault class="status">{{ row.status }}</span>
                  </ng-container>
                </td>
              </ng-container>

              <!-- User Column -->
              <ng-container matColumnDef="user">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
                <td mat-cell *matCellDef="let row">
                  {{ row.employee?.userName || "" }}
                </td>
              </ng-container>

              <!-- Project Column -->
              <ng-container matColumnDef="project">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Project</th>
                <td mat-cell *matCellDef="let row">
                  {{ row.project?.title || "" }}
                </td>
              </ng-container>

              <!-- Date Created Column -->
              <ng-container matColumnDef="creationDate">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Date Created
                </th>
                <td mat-cell *matCellDef="let row">
                  {{ row.creationDate | date: "short" }}
                </td>
              </ng-container>

              <!-- Actions Column -->
              <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let row">
                  <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Example icon-button with a menu">
                    <mat-icon>more_vert</mat-icon>
                  </button>
                  <mat-menu #menu="matMenu">
                    <button mat-menu-item (click)="openViewTaskDialog(row)">
                      <mat-icon>visibility</mat-icon>
                      <span>View</span>
                    </button>
                    <button mat-menu-item [routerLink]="['edit', row.id]">
                      <mat-icon class="custom-icon-color">edit_square</mat-icon>
                      <span>Edit</span>
                    </button>
                    <button mat-menu-item (click)="openDeleteTaskDialog(row)">
                      <mat-icon fontIcon="delete"></mat-icon>
                      <span>Delete</span>
                    </button>
                  </mat-menu>
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns; let i = index"
                [class]="i % 2 !== 0 ? 'odd-row' : ''"></tr>

              <!-- Row shown when there is no matching data. -->
              <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="6">
                  <app-empty-status [elementName]="input.value" />
                </td>
              </tr>
            </table>

            <mat-paginator [length]="length" [pageSize]="pageSize" [pageIndex]="pageNumber - 1"
              [pageSizeOptions]="[10, 25, 100]" (page)="onPageChange($event)"
              aria-label="Select page of users"></mat-paginator>
          </ng-container>
        </ng-template>

        <!-- EMPTY STATE -->
        <ng-template #emptyState>
          <app-empty-status></app-empty-status>
        </ng-template>

      </div>
    </div>
  </div>
  <!-- Loader (Shown when users && Tasks data is not yet loaded) -->
  <ng-template #loader>
    <app-loader></app-loader>
  </ng-template>
</section>

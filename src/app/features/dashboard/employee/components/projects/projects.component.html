<section class="project-list-wrapper">
  <!-- start of header -->
  <div class="container-fluid project-list-header">
    <div class="row d-flex align-items-center justify-content-between mx-auto">
      <h3 class="col-md-9 m-0 p-0 table-header-title">Projects</h3>
    </div>
  </div>
  <!-- end of header -->

  <!-- start of table -->
  <div class="container-fluid project-list-table-container mx-auto">
    <div class="project-list-table">
      <div class="project-list-table-header">
        <mat-form-field appearance="fill" class="custom-input">
          <mat-label class="d-flex align-items-center gap-1">
            <mat-icon
              aria-hidden="false"
              aria-label="Example home icon"
              fontIcon="search"
            ></mat-icon
            >Search By Title</mat-label
          >
          <input matInput (keyup)="applyFilter($event)" #input />
        </mat-form-field>
      </div>

      <div class="mat-elevation-z8">
        <!-- LOADING -->
        <ng-container *ngIf="isLoading; else content">
          <app-loader></app-loader>
        </ng-container>

        <!-- CONTENT -->
        <ng-template #content>
          <ng-container
            *ngIf="
              dataSource.data && dataSource.data.length > 0;
              else emptyState
            "
          >
            <table mat-table [dataSource]="dataSource" matSort>
              <!-- Title Column -->
              <ng-container matColumnDef="title">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Title</th>
                <td mat-cell *matCellDef="let row">{{ row.title }}</td>
              </ng-container>
              <!-- Descraption Column -->
              <ng-container matColumnDef="Descraption">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Descraption
                </th>
                <td mat-cell *matCellDef="let row">{{ row.description }}</td>
              </ng-container>

              <!-- Num Tasks Column -->
              <ng-container matColumnDef="Num Tasks">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Num Tasks
                </th>
                <td mat-cell *matCellDef="let row">{{ row.task?.length }}</td>
              </ng-container>
              <!-- Date Created Column -->
              <ng-container matColumnDef="creation Date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  Date Created
                </th>
                <td mat-cell *matCellDef="let row">
                  {{ row.creationDate | date: "short" }}
                </td>
              </ng-container>
              <!-- Date Created Column -->
              <ng-container matColumnDef="modification Date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>
                  modification Date
                </th>
                <td mat-cell *matCellDef="let row">
                  {{ row.modificationDate | date: "short" }}
                </td>
              </ng-container>
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr
                mat-row
                *matRowDef="let row; columns: displayedColumns; let i = index"
                [class]="i % 2 !== 0 ? 'odd-row' : ''"
              ></tr>

              <!-- Row shown when there is no matching data. -->
              <tr class="mat-row" *matNoDataRow>
                <td class="mat-cell" colspan="6">
                  <app-empty-status [elementName]="input.value" />
                </td>
              </tr>
            </table>

            <mat-paginator
              [length]="length"
              [pageSize]="pageSize"
              [pageIndex]="pageNumber - 1"
              [pageSizeOptions]="[10, 25, 100]"
              (page)="onPageChange($event)"
              aria-label="Select page of users"
            ></mat-paginator>
          </ng-container>
        </ng-template>

        <!-- EMPTY STATE -->
        <ng-template #emptyState>
          <app-empty-status></app-empty-status>
        </ng-template>
      </div>
    </div>
  </div>
  <!-- Loader (Shown when users && Tasks data is not yet loaded) -->
  <ng-template #loader>
    <app-loader></app-loader>
  </ng-template>
</section>
